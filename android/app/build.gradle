plugins { id 'com.android.application' }

android {
    namespace 'com.worldfrontier.game3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.worldfrontier.game3d"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // the WebGL game lives in assets/www and is loaded by MainActivity
    androidResources { noCompress 'js' }
}
