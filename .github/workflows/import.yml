name: Import project files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download source archive from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/src
          gh release download v1.0.1 --repo "${{ github.repository }}" --pattern "*.zip" --dir /tmp/src --clobber
          ls -la /tmp/src
          unzip -o /tmp/src/*.zip -d /tmp/out
          ls -la /tmp/out
      - name: Import into repository
        run: |
          shopt -s dotglob
          cp -r /tmp/out/repo/* .
          rm -f .github/workflows/import.yml
          git config user.name "world-frontier-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Ship v1.0.1 APK (versionCode 2) and refreshed screenshots" || echo "nothing to commit"
          git push
